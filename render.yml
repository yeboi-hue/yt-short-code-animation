name: Render pyramid short

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "Render scale (1 = 1080x1920, 0.5 = quick preview, 1.3333 = 1440x2560)"
        default: "1"
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages (ffmpeg, espeak fallback voice, Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 libgbm1

      - name: Narration + sound + shot timing
        run: |
          pip install edge-tts numpy
          python scripts/make_audio.py

      - name: Install npm packages
        run: npm install --no-audit --no-fund

      - name: Download Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render MP4 (software WebGL)
        run: |
          SCALE="${{ github.event.inputs.scale }}"
          npx remotion render src/index.ts PyramidShort out/pyramid.mp4 \
            --codec h264 --crf 18 --gl=swangle --concurrency=3 --timeout=180000 --scale="${SCALE:-1}"

      - name: Check the file
        run: ffprobe -v error -show_entries stream=codec_type,width,height,duration -of default=nw=1 out/pyramid.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: pyramid-short-mp4
          path: out/pyramid.mp4
          retention-days: 30
